name: DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scanner tout l'historique (.gitleaksignore appliqué)
        run: gitleaks detect --source . --redact -v --exit-code 1

  trivy:
    name: Configuration et image (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config (bloquant sur CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
      - name: Trivy image WordPress (rapport, non bloquant)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: docker.io/bitnami/wordpress:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-image.txt
          exit-code: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image
          path: trivy-image.txt

  checkov:
    name: IaC (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes,github_actions,secrets
          skip_check: CKV_SECRET_6,CKV_K8S_21
          soft_fail: false
