externalDatabase:
  existingSecret: wordpress-credentials
  host: mariadb-release.default.svc.cluster.local
  port: 3306
  user: user
  database: wordpress

existingSecret: wordpress-credentials
wordpressDatabaseHost: mariadb-release.default.svc.cluster.local
wordpressDatabaseName: wordpress
wordpressDatabaseUser: user
wordpressUsername: admin
persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    memory: 512Mi
    cpu: 300m
  limits:
    memory: 1Gi
    cpu: 600m
mariadb:
  enabled: false

