apiVersion: v1
kind: ServiceAccount
metadata:
  name: liqo-auth
  namespace: liqo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: liqo-auth-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: liqo-auth
  namespace: liqo
